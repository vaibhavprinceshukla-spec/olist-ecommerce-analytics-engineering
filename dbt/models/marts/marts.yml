version: 2

models:

  # =========================
  # DIM CUSTOMERS
  # =========================

  - name: dim_customers
    description: "Customer dimension containing customer identity and geographic information."

    columns:

      - name: customer_id
        description: "Unique identifier for a customer order record."
        tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: "Unique identifier representing the actual customer."

      - name: customer_state
        description: "Customer state in Brazil."


  # =========================
  # DIM PRODUCTS
  # =========================

  - name: dim_products
    description: "Product dimension containing product and category information."

    columns:

      - name: product_id
        description: "Unique identifier for the product."
        tests:
          - not_null
          - unique

      - name: product_category_name
        description: "Original Portuguese product category."

      - name: product_category_name_english
        description: "English product category."


  # =========================
  # DIM SELLERS
  # =========================

  - name: dim_sellers
    description: "Seller dimension containing seller location information."

    columns:

      - name: seller_id
        description: "Unique identifier for the seller."
        tests:
          - not_null
          - unique

      - name: seller_state
        description: "Seller state in Brazil."


  # =========================
  # DIM DATE
  # =========================

  - name: dim_date
    description: "Date dimension used for time-based analysis."

    columns:

      - name: date
        description: "Calendar date."
        tests:
          - not_null
          - unique


  # =========================
  # FACT ORDERS
  # =========================

  - name: fct_orders
    description: "Order-level fact table. Grain: one row per order."

    columns:

      - name: order_id
        description: "Unique identifier for the order."
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer who placed the order."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: order_date
        description: "Date on which the order was purchased."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date

      - name: order_status
        description: "Current status of the order."
        tests:
          - not_null
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - unavailable
                - invoiced
                - processing
                - created
                - approved

      - name: total_order_value
        description: "Product revenue plus freight value."

      - name: total_payment_value
        description: "Total payment value associated with the order."

      - name: average_review_score
        description: "Average customer review score for the order."

      - name: delivery_status
        description: "Delivery performance classification."
        tests:
          - accepted_values:
              values:
                - On Time
                - Late
                - Not Delivered


  # =========================
  # FACT ORDER ITEMS
  # =========================

  - name: fct_order_items
    description: "Order-item-level fact table. Grain: one row per order item."

    columns:

      - name: order_id
        description: "Order containing the item."
        tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id

      - name: order_item_id
        description: "Sequential item number within an order."
        tests:
          - not_null

      - name: product_id
        description: "Product associated with the order item."
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id

      - name: seller_id
        description: "Seller responsible for the order item."
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_id

      